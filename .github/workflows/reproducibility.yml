name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependency
        run: python -m pip install -r requirements.txt

      - name: Verify repository checksums
        run: bash verify_checksums.sh

      - name: Run complete reproducibility suite
        run: bash run_all.sh
